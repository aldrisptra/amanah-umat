[build]
  command = "npm run build"
  publish = "dist"

# Aplikasi ini memakai routing sisi klien (history mode).
# Tanpa aturan di bawah, membuka atau me-refresh /donasi, /galeri, dsb.
# secara langsung akan menghasilkan halaman 404 dari server.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
